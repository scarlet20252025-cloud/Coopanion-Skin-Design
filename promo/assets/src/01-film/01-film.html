 <g transform="translate(120 618)"><rect width="636" height="152" rx="18" fill="#1b202b"/><path d="M28 31H270M28 65H524M28 99H416" stroke="#726a83" stroke-width="7" stroke-linecap="round"/><circle cx="598" cy="31" r="7" fill="#baa0e3"/></g>
</g>

<g id="desktop" opacity="0">
 <rect x="940" y="150" width="820" height="765" rx="24" fill="#121821" stroke="#343745" stroke-width="2"/>
 <path d="M940 215H1760" stroke="#343745" stroke-width="2"/>
 <circle cx="972" cy="183" r="6" fill="#5e566e"/><circle cx="996" cy="183" r="6" fill="#796584"/><circle cx="1020" cy="183" r="6" fill="#b69acf"/>

 </g>
